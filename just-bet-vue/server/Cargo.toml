[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.0", features = ["postgres", "chrono"] }
tokio = { version = "1.42.0", features = ["full"] }
axum = { version = "0.7.9", features = ["macros", "ws"] }
dotenvy = "0.15"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
diesel-async = { version = "0.8.0", features = ["postgres","deadpool"] }
anyhow = "1.0.102"
chrono =  { version = "0.4.44", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
axum-extra = {version = "0.9", default-features = false, features = ["cookie"]}
snowflaked = "1.0.3"
tower-http =  { version = "0.6.2", default-features = false, features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.1"
